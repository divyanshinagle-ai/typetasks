<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeTasks Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <h1>TypeTasks</h1>

    <!-- Task Input Row -->
    <div class="addrow">
      <input id="title" type="text" placeholder="Add a new task..." />
      <button id="add">Add Task</button>
    </div>

    <!-- Filter Buttons -->
    <div id="filters">
      <button class="filter-btn" data-status="all">All</button>
      <button class="filter-btn" data-status="todo">Todo</button>
      <button class="filter-btn" data-status="in-progress">In-Progress</button>
      <button class="filter-btn" data-status="done">Done</button>
    </div>

    <!-- Task List -->
    <ul id="list"></ul>
  </div>

  <!-- Load compiled JS output as a module -->
  <script type="module" src="app.js"></script>
</body>
</html>
